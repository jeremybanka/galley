name: Cache Rust compilation
description: Reuse locked dependencies and compiled artifacts for a Rust build mode.
inputs:
  mode:
    description: Separate release Wasm compilation from native tests and checks.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.mode }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'mise.toml', 'packages/dprint-plugin-mdx/**', 'scripts/build-mdx-plugin.node.ts', 'scripts/mdx-plugin-licenses.ts') }}
        restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-${{ inputs.mode }}-
